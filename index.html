<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)" />

    <title>NapLive - Streamer Indonesia</title>
    <meta
      name="description"
      content="NapLive: livestream, upload, dan art. Tiga channel YouTube (NapKing, NapLive, Nepnep) dan art di X."
    />
    <meta name="author" content="NapLive" />
    <link rel="canonical" href="https://naplive.vtube-info.xyz/" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="NapLive" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="NapLive - Streamer Indonesia" />
    <meta
      property="og:description"
      content="Livestream, upload, dan art. Tiga channel YouTube dan art di X."
    />
    <meta property="og:url" content="https://naplive.vtube-info.xyz/" />
    <meta property="og:image" content="https://naplive.vtube-info.xyz/og-image.png" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:type" content="image/png" />
    <meta name="og:image:alt" content="NapLive" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NapLive - Streamer Indonesia" />
    <meta
      name="twitter:description"
      content="Livestream, upload, dan art. Tiga channel YouTube dan art di X."
    />
    <meta name="twitter:image" content="https://naplive.vtube-info.xyz/og-image.png" />

    <!-- The tab icon is the avatar itself, same file the social card uses.
         iOS ignores WebP for touch icons, so that one stays PNG. -->
    <link rel="icon" type="image/png" href="/og-image.png" />
    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "NapLive",
        "alternateName": ["@naplive7", "@napking7", "@nepnep7", "@Alfachri9"],
        "description": "Streamer Indonesia. Livestream, upload, dan art.",
        "url": "https://naplive.vtube-info.xyz/",
        "image": "https://naplive.vtube-info.xyz/media/avatar-youtube.webp",
        "sameAs": [
          "https://www.youtube.com/@naplive7",
          "https://www.youtube.com/@napking7",
          "https://www.youtube.com/@nepnep7",
          "https://x.com/Alfachri9"
        ]
      }
    </script>

    <script>
      // Runs before first paint so the correct token set is already on screen.
      // Without this, a dark-mode visitor eats one light flash on every load.
      (function () {
        try {
          var stored = localStorage.getItem("naplive-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? "light" : "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
